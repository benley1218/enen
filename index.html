<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yu En's Learning Corner</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Fredoka:wght@500;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4d6;--ink:#2b2140;--muted:#6e6283;--red:#e0402f;--red-d:#a92a1e;--blue:#1F5FBF;--blue-d:#16438a;--card:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1630;--ink:#fbefd6;--muted:#b9acd0;--card:#2a2244;--red:#ff5a45;--blue:#5f93ee}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Fredoka,"Noto Sans SC",system-ui,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
main{width:100%;max-width:820px;text-align:center}
h1{font-size:clamp(30px,6vw,46px);margin:0 0 6px}
p.sub{margin:0 0 28px;color:var(--muted);font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
a.card{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:#fff;border-radius:28px;padding:34px 18px;min-height:250px;justify-content:center;transition:transform .15s}
a.card:hover{transform:translateY(-4px) rotate(-1deg)}
a.card:focus-visible{outline:4px solid var(--ink);outline-offset:4px}
.cn{background:var(--red);box-shadow:0 8px 0 var(--red-d)}
.ma{background:var(--blue);box-shadow:0 8px 0 var(--blue-d)}
.big{font-size:84px;line-height:1;font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif}
.ma .big{font-family:Fredoka,sans-serif;font-weight:700}
.t{font-size:28px;font-weight:700}
.d{font-size:16px;opacity:.95;max-width:26ch}
</style>
</head>
<body>
<main>
  <h1>Yu En's Learning Corner</h1>
  <p class="sub">Pick a subject to start</p>
  <div class="grid">
    <a class="card cn" href="chinese/"><span class="big">成语</span><span class="t">Chinese 华文</span><span class="d">50 chengyu story videos with voice-over, quizzes and games</span></a>
    <a class="card ma" href="maths/"><span class="big">1+2</span><span class="t">Maths</span><span class="d">Daily P3 practice with guided help and reward games</span></a>
  </div>
</main>
</body>
</html>
