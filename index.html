<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yu En's Maths Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F6; --paper:#FFFFFF; --ink:#18293D; --muted:#56687D; --rule:#CFD9E4;
  --line:#0B8A4E; --line-soft:#D6F0E1; --sun:#E89A00; --sun-soft:#FFF2D1;
  --coral:#CC4B2C; --coral-soft:#FBE4DC; --blue:#1F5FBF; --blue-soft:#DEE8FA; --pink:#E0567F; --pink-soft:#FBDDE6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101923; --paper:#1A2633; --ink:#E6EDF5; --muted:#9DB0C4; --rule:#2B3B4D;
    --line:#3CC97F; --line-soft:#1B3A2A; --sun:#FFC247; --sun-soft:#3A2F14;
    --coral:#FF7C5E; --coral-soft:#3E231C; --blue:#79A8FF; --blue-soft:#1C2A44; --pink:#FF86A8; --pink-soft:#40202B;
  }
}
:root[data-theme="dark"]{
  --bg:#101923; --paper:#1A2633; --ink:#E6EDF5; --muted:#9DB0C4; --rule:#2B3B4D;
  --line:#3CC97F; --line-soft:#1B3A2A; --sun:#FFC247; --sun-soft:#3A2F14;
  --coral:#FF7C5E; --coral-soft:#3E231C; --blue:#79A8FF; --blue-soft:#1C2A44; --pink:#FF86A8; --pink-soft:#40202B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.55 "Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-weight:600;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
img,svg{max-width:100%}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px 60px}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;text-underline-offset:3px;padding:6px 0;font-size:17px}
.btn{background:var(--line);color:#fff;border:0;border-radius:14px;padding:14px 26px;font-family:"Fredoka",system-ui,sans-serif;font-size:21px;font-weight:600;box-shadow:0 4px 0 color-mix(in srgb,var(--line) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--line) 60%,#000)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--blue);box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.btn.soft{background:var(--paper);color:var(--ink);border:2px solid var(--rule);box-shadow:none}
.muted{color:var(--muted)}

/* ---------- home ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.top h1{font-size:40px}
.top .sub{margin:6px 0 0;color:var(--muted);font-size:18px}
.linebox{margin:22px -20px 8px;overflow-x:auto;padding:4px 20px 6px;scrollbar-width:thin}
.linebox svg{display:block;max-width:none}
.st-label{font:600 13px "Fredoka",system-ui,sans-serif;fill:var(--muted)}
.st-label.today{fill:var(--ink)}
.ride{background:var(--paper);border-radius:22px;padding:26px;margin-top:18px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;border:2px solid var(--rule)}
.ride h2{font-size:28px}
.ride p{margin:6px 0 0;color:var(--muted)}
@media (max-width:620px){.ride{grid-template-columns:1fr}}
.skills{margin-top:30px}
.skills h2{font-size:24px;margin-bottom:10px}
.skill{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--rule)}
.skill:last-child{border-bottom:0}
.skill .nm{font-weight:700}
.skill .nt{font-size:15px;color:var(--muted)}
.stars{font-size:22px;letter-spacing:2px;color:var(--sun);white-space:nowrap}
.stars .off{color:var(--rule)}
.pill{border:2px solid var(--rule);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700}
.pill:hover{border-color:var(--line)}

/* ---------- quest ---------- */
.qbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:space-between}
.mini{display:flex;align-items:center}
.mini span{width:16px;height:16px;border-radius:50%;border:3px solid var(--line);background:var(--paper)}
.mini span.done{background:var(--line)}
.mini span.now{width:24px;height:24px;border-color:var(--sun);border-width:5px}
.mini i{width:34px;height:5px;background:var(--line)}
.qcard{background:var(--paper);border-radius:22px;padding:28px;margin-top:18px;border:2px solid var(--rule)}
.qcard.is-twin{border-color:var(--blue)}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 12px;color:var(--muted);font-size:16px;font-weight:700}
.tag{background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:2px 12px;font-size:14px}
.qtext{font-size:22px;line-height:1.55;max-width:68ch}
.qtext b{font-weight:700}
.figure{margin:18px 0 4px}
.paper{margin:18px 0 12px;font-size:16px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{background:var(--paper);border:3px solid var(--rule);border-radius:16px;padding:16px;font-family:"Fredoka",system-ui,sans-serif;font-size:26px;font-weight:600;text-align:center;min-height:72px;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.good{border-color:var(--line);background:var(--line-soft)}
.opt.bad{border-color:var(--coral);background:var(--coral-soft);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.opt.faded{opacity:.45}
.actions{margin-top:20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fb{margin-top:18px;border-radius:16px;padding:16px 18px;font-size:19px}
.fb:empty{display:none}
.fb.good{background:var(--line-soft)}
.fb.clue{background:var(--sun-soft)}
.fb.miss{background:var(--coral-soft)}
.fb h3{font-size:22px;margin-bottom:4px}
.fb p{margin:6px 0 0}
.sol{margin:10px 0 0;padding-left:22px}
.sol li{margin:4px 0}
.walk{margin-top:16px;border:2px dashed var(--line);border-radius:16px;padding:16px 18px}
.walk h3{font-size:22px}
.walk .tip{margin:8px 0;background:var(--line-soft);border-radius:10px;padding:8px 12px}
.walk .sol li{font-size:20px}
.walk .sol li.fresh{animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.burst{display:inline-block;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}

/* guide */
.guide{background:var(--paper);border:3px solid var(--sun);border-radius:22px;padding:24px 26px;margin-top:18px}
.guide-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.guide-head h2{font-size:26px}
.dots{display:flex;gap:6px}
.dots span{width:12px;height:12px;border-radius:50%;background:var(--rule)}
.dots span.on{background:var(--sun)}
.dots span.ok{background:var(--line)}
.step h3{font-size:22px;margin:16px 0 6px}
.step p{margin:6px 0}
.ask{margin-top:14px}
.ask .q{font-weight:700;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:3px solid var(--rule);background:var(--paper);border-radius:14px;padding:10px 18px;font-size:20px;font-weight:700}
.chip:hover:not([disabled]){border-color:var(--blue)}
.chip.good{border-color:var(--line);background:var(--line-soft)}
.chip.bad{border-color:var(--coral);background:var(--coral-soft)}
.hint{margin-top:12px;background:var(--sun-soft);border-radius:12px;padding:10px 14px}
.hint:empty{display:none}
.nextrow{margin-top:18px}
.hidden{display:none!important}

/* widgets */
.w{margin-top:10px}
.w .goal{font-size:20px}
.track{position:relative;height:16px;background:var(--rule);border-radius:999px;margin:34px 6px 16px}
.track-fill{position:absolute;left:0;top:0;bottom:0;background:var(--line);border-radius:999px;transition:width .35s}
.track-dot{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--sun);border:4px solid var(--paper);transition:left .35s}
.track-lbl{position:absolute;top:-30px;font-size:15px;font-weight:700;color:var(--muted)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.wbtn{border:3px solid var(--line);background:var(--line-soft);border-radius:12px;padding:8px 16px;font-weight:700;font-size:19px}
.wbtn.ghost{border-color:var(--rule);background:var(--paper)}
.hops{display:flex;flex-wrap:wrap;gap:8px;min-height:10px;margin:6px 0}
.hops span{background:var(--blue-soft);border-radius:8px;padding:2px 10px;font-size:16px}
.readout{font-size:20px}
.msg{margin-top:8px;font-weight:700}
.msg.ok{color:var(--line)}
.msg.no{color:var(--coral)}
.blocks{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.blk{min-width:120px;height:74px;border-radius:14px;border:3px dashed var(--blue);background:var(--blue-soft);font:600 22px "Fredoka",system-ui,sans-serif}
.blk.open{border-style:solid;border-color:var(--line);background:var(--line-soft)}
.blk.mins{min-width:84px;border-style:solid;border-color:var(--sun);background:var(--sun-soft);cursor:default}
.range{width:100%;max-width:520px;height:34px;accent-color:var(--pink)}
.cart{display:grid;gap:10px;margin:12px 0}
.item{display:grid;grid-template-columns:minmax(0,1fr) 110px auto 72px;gap:12px;align-items:center;border:2px solid var(--rule);border-radius:14px;padding:10px 14px}
.item .pr{color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:38px;height:38px;border-radius:10px;border:2px solid var(--rule);background:var(--paper);font-weight:700;font-size:20px}
.qty b{min-width:24px;text-align:center;font-size:21px}
.icons{font-size:30px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:8px 0}
.icons .eq{font-size:20px;font-weight:700;margin-left:10px}
.grp{border:3px solid var(--sun);border-radius:12px;padding:2px 8px;display:inline-flex;gap:4px}
.grp.hl{background:var(--sun-soft)}
.x{opacity:.3;text-decoration:line-through}
.tags{display:flex;flex-wrap:wrap;gap:12px}
.ptag{border:2px solid var(--ink);border-radius:12px;padding:10px 16px;text-align:center;min-width:130px}
.ptag .n{font-weight:700;text-transform:capitalize}
.fr{display:inline-flex;align-items:center;gap:16px;font:600 30px "Fredoka",system-ui,sans-serif}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1}
.frac i{display:block;width:100%;height:3px;background:var(--ink);margin:4px 0}
.frac .box{width:44px;height:44px;border:3px solid var(--ink);border-radius:4px}

/* done + parents */
.done h1{font-size:40px}
.big{font:700 64px "Fredoka",system-ui,sans-serif;color:var(--line)}
.rlist{list-style:none;padding:0;margin:16px 0}
.rlist li{padding:10px 0;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:center}
.parent h2{font-size:24px;margin:28px 0 10px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:17px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;color:var(--muted)}
.card{background:var(--paper);border:2px solid var(--rule);border-radius:18px;padding:18px 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi b{display:block;font:700 34px "Fredoka",system-ui,sans-serif}
.kpi span{color:var(--muted);font-size:16px}
.dlg-back{position:fixed;inset:0;background:rgba(10,20,30,.45);display:grid;place-items:center;padding:20px;z-index:50}
.dlg{background:var(--paper);border-radius:22px;padding:26px;max-width:440px;width:100%;border:2px solid var(--rule)}
.dlg h2{font-size:26px}
.dlg p{margin:10px 0 0;color:var(--muted)}
.btn.danger{background:var(--coral);box-shadow:0 4px 0 color-mix(in srgb,var(--coral) 60%,#000)}
.ridebtns{display:flex;flex-direction:column;gap:12px}
.teaser{margin:12px 4px 0;color:var(--muted)}
.gcard{background:var(--paper);border:2px solid var(--rule);border-radius:22px;padding:24px;margin-top:18px}
.gcard h1{font-size:34px}
.ghow{margin:8px 0 12px;color:var(--muted);max-width:70ch}
.ghud{font-size:20px;min-height:32px;margin-bottom:8px}
.gpanel{text-align:center;padding:40px 16px;border:3px dashed var(--rule);border-radius:18px}
.gpanel p{margin:6px 0}
.gcanvas{display:block;width:100%;max-width:760px;aspect-ratio:760/420;border-radius:16px;touch-action:none;margin:0 auto;cursor:pointer}
.mgrid{display:grid;gap:10px;max-width:760px;margin:0 auto}
.mcard{position:relative;height:92px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:600 20px "Fredoka",system-ui,sans-serif;padding:6px}
.mcard .mb{display:none}.mcard.up{background:var(--sun-soft);color:var(--ink);border:3px solid var(--sun)}
.mcard.up .mf{display:none}.mcard.up .mb{display:block}
.mcard.got{background:var(--line-soft);border-color:var(--line)}
.mcard .mf{font-size:34px}
.bstage{position:relative;width:100%;max-width:760px;aspect-ratio:760/420;margin:0 auto;border-radius:16px;overflow:hidden;background:linear-gradient(#9FD4F5,#E6F5FD)}
.btarget{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;color:#18293D;border-radius:999px;padding:4px 20px;font:600 24px "Fredoka",system-ui,sans-serif;z-index:2}
.balloon{position:absolute;width:68px;height:82px;border:0;border-radius:50% 50% 48% 48%;background:var(--c);color:#fff;font:700 22px "Fredoka",system-ui,sans-serif;box-shadow:inset -8px -8px 0 rgba(0,0,0,.12)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:26px;background:rgba(0,0,0,.35)}
.balloon.sel{outline:5px solid #fff;outline-offset:2px;transform:scale(1.12)}
.balloon.popped{transform:scale(1.6);opacity:0;transition:all .3s}
.balloon.shake{animation:shake .4s}
@keyframes shake{25%{margin-left:-6px}75%{margin-left:6px}}
.backup.warn{border-color:var(--sun);background:var(--sun-soft)}
.stn{cursor:pointer}.stn:focus{outline:none}.stn:focus-visible circle:first-child{stroke:var(--blue);stroke-width:3}
.redo{display:flex;flex-wrap:wrap;gap:10px}
.rchip{border:2px solid var(--rule);background:var(--paper);border-radius:14px;padding:8px 14px;display:flex;flex-direction:column;align-items:flex-start;min-width:110px}
.rchip:hover{border-color:var(--line)}.rchip span{font-size:14px;color:var(--muted)}
.ansPick{font-weight:700}.ansPick select{font:inherit;font-size:17px;padding:6px 10px;border-radius:10px;border:2px solid var(--rule);background:var(--paper);color:var(--ink);max-width:100%}
.alist{padding-left:22px;margin:14px 0 0}
.aitem{padding:12px 0;border-bottom:1px solid var(--rule)}.aitem:last-child{border-bottom:0}
.ahead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ares{font-weight:700;font-size:16px}
.aq{margin:6px 0;font-size:17px}
.atab{font-size:16px}.atab td{white-space:normal;vertical-align:top;padding:5px 8px}.atab td:first-child{color:var(--muted);white-space:nowrap;width:1%}
.atab .ok{color:var(--line);font-weight:700}.atab .no{color:var(--coral);font-weight:700}
.ldiv{font:600 22px/1.25 ui-monospace,Menlo,Consolas,monospace;background:var(--paper);border:2px solid var(--rule);border-radius:12px;padding:10px 16px;display:inline-block;margin:6px 0}
.fracrow{display:flex;align-items:center;gap:22px;font:600 30px "Fredoka",system-ui,sans-serif}.fracrow .sep{color:var(--muted)}
.qtext .frac{font-size:.95em;vertical-align:middle;margin:0 2px}.qtext .frac i{height:2px;margin:2px 0}
.learn{border-color:var(--sun)}.learn h2{font-size:26px;margin:4px 0 10px}
.learn .ex{border:2px dashed var(--line);border-radius:16px;padding:14px 16px;margin-top:12px}
.learn .exlbl{margin:0 0 6px;font-weight:700;color:var(--line)}.learn .qtext{font-size:19px}.learn .ans{font-size:19px;margin:8px 0 0}
.tip{background:var(--line-soft);border-radius:10px;padding:8px 12px}.hintbox{margin-top:14px}
.badge{font-size:13px;background:var(--sun-soft);border-radius:999px;padding:2px 10px;font-weight:700}
.subh{font-size:18px;margin:18px 0 4px;color:var(--muted)}
.give{display:grid;gap:8px;margin:8px 0}.grow{display:grid;grid-template-columns:100px 1fr 40px;align-items:center;gap:10px;font-size:24px}.grow b{font-size:17px}.grow .cnt{font-size:22px}
rect.cell{cursor:pointer}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app" class="wrap" aria-live="polite"></div>
<script>
"use strict";
// ==GEN START==
const pad=n=>String(n).padStart(2,'0');
let RNG=Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function withSeed(seed,fn){const old=RNG;RNG=mulberry32(seed);try{return fn()}finally{RNG=old}}
const R={
  rand:()=>RNG(),
  int:(a,b)=>a+Math.floor(RNG()*(b-a+1)),
  pick:a=>a[Math.floor(RNG()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
};
const NAMES=['Mei Xin','Aisyah','Rahul','Jun Hao','Priya','Farhan','Wei Ling','Hui Min','Arjun','Nurul'];
const money=c=>'$'+(c/100).toFixed(2);
function t12(m){m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60;return (h%12||12)+'.'+pad(mm)+' '+(h>=12?'p.m.':'a.m.')}
function t24(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+pad(m%60)}
function dur(m){const h=Math.floor(m/60),mm=m%60;if(!h)return mm+' min';if(!mm)return h+' h';return h+' h '+mm+' min'}
function isPosInt(v){return Number.isInteger(v)&&v>0}

// 4 answer options: correct + misconception distractors (+ filler)
function makeOptions(correct,ds,fill){
  const seen=new Set([correct]);const out=[{label:correct,code:'ok'}];
  for(const d of ds){if(out.length>=4)break;if(d.label==null||seen.has(d.label))continue;seen.add(d.label);out.push(d)}
  let g=0;while(out.length<4&&g++<80){const l=fill();if(l!=null&&!seen.has(l)){seen.add(l);out.push({label:l,code:'other'})}}
  return R.shuffle(out);
}
function makeAsk(q,correct,wrongs,hint){
  const seen=new Set([correct]);const opts=[correct];
  for(const w of wrongs){if(w==null||seen.has(w))continue;seen.add(w);opts.push(w);if(opts.length>=4)break}
  return {q,correct,options:R.shuffle(opts),hint};
}

const SKILLS={
  timeEnd:{name:'Finish time & 24-hour clock',short:'Time',warm:true},
  minutes:{name:'Hours and minutes',short:'Time',warm:true},
  fraction:{name:'Equivalent fractions',short:'Fractions',warm:true},
  money:{name:'Money: how much more?',short:'Money',warm:false},
  beforeAfter:{name:'Before and after (model drawing)',short:'Model drawing',warm:false},
  sets:{name:'Comparing two groups',short:'Model drawing',warm:false},
  squares:{name:'Squares and perimeter',short:'Geometry',warm:false},
  longDiv:{name:'Long division',short:'Division',warm:true,isNew:true},
  place:{name:'How many hundreds or tens?',short:'Place value',warm:true,isNew:true},
  fracHalf:{name:'Fractions more than ½',short:'Fractions',warm:true,isNew:true},
  fracAdd:{name:'Adding fractions',short:'Fractions',warm:true,isNew:true},
  shadeMore:{name:'Shade a fraction: how many more?',short:'Fractions',warm:true,isNew:true},
  areaHalves:{name:'Area with half squares',short:'Area',warm:true,isNew:true},

// ---- clock figure ----
function clockSVG(mins,size){
  size=size||170;const c=100,hr=((mins/60)%12),mn=mins%60;
  const ha=(hr*30-90)*Math.PI/180, ma=(mn*6-90)*Math.PI/180;
  let t='';for(let i=1;i<=12;i++){const a=(i*30-90)*Math.PI/180;t+=`<text x="${c+68*Math.cos(a)}" y="${c+68*Math.sin(a)+7}" text-anchor="middle" font-size="20" font-family="Fredoka,sans-serif" fill="currentColor">${i}</text>`}
  let k='';for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?86:82;k+=`<line x1="${c+r1*Math.cos(a)}" y1="${c+r1*Math.sin(a)}" x2="${c+90*Math.cos(a)}" y2="${c+90*Math.sin(a)}" stroke="currentColor" stroke-width="${i%5?1:3}"/>`}
  return `<svg viewBox="0 0 200 200" width="${size}" height="${size}" role="img" aria-label="A clock face"><circle cx="100" cy="100" r="94" fill="var(--paper)" stroke="currentColor" stroke-width="4"/>${k}${t}<line x1="100" y1="100" x2="${c+46*Math.cos(ha)}" y2="${c+46*Math.sin(ha)}" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><line x1="100" y1="100" x2="${c+74*Math.cos(ma)}" y2="${c+74*Math.sin(ma)}" stroke="var(--coral)" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="currentColor"/></svg>`;
}

function genTimeEnd(){
  const n=R.pick(NAMES);

  const dh=R.pick([1,2]),dm=R.pick([15,20,25,30,40,45,50]);
  const need=dh*60+dm,end=start+need,D=dur(need);

    `The clock shows the time ${n} started baking cookies in the afternoon. Baking took <b>${D}</b>. What time did ${n} finish baking?`,
    `The clock shows the time a movie started in the afternoon. The movie lasted <b>${D}</b>. What time did the movie end?`,
    `The clock shows the time ${n} reached the library in the afternoon. ${n} spent <b>${D}</b> there. What time did ${n} leave the library?`,
    `The clock shows the time a swimming lesson started in the afternoon. The lesson lasted <b>${D}</b>. What time did the lesson end?`
  ]);
  const carry=(start%60)+dm>=60,ds=[];
  if(carry)ds.push({label:pad(Math.floor(start/60)+dh)+pad(start%60+dm),code:'noCarry'});

  const why={
    noCarry:`There is no ":${start%60+dm}" on a clock! 60 minutes make 1 hour, so carry it into the hours.`,
    forgotHours:`You added the ${dm} minutes, but the ${dh} hour${dh>1?'s':''} went missing. Add both.`,
    no12:`So close! That is the morning time. After 12 noon, the 24-hour clock adds 12 to the hour.`,
    hoursOnly:`You added ${dh} h, but not the ${dm} min.`,
    other:`Read the start time on the clock again, then add ${D}.`
  };
  const endH=Math.floor(end/60);
  return {skill:'timeEnd',brief:`Clock showed ${t12(start)}`,
    text:ctx+' Give your answer in <b>24-hour clock</b>.',
    figure:`<div class="figure">${clockSVG(start)}</div>`,
    options:makeOptions(t24(end),ds,()=>t24(end+R.pick([-60,60,-10,10,-5,5]))),answer:t24(end),why,
    remedy:[
      {title:'Read the clock',visual:`<div class="figure">${clockSVG(start,150)}</div>`,
       ask:makeAsk('What time does the clock show?',t12(start),[t12(start+60),t12(start-60),t12(start+5)],'The short hand shows the hour. If it is between two numbers, use the smaller one. The long hand shows the minutes: count 5 for each number.')},
      {title:'Jump along the time line',text:'Add the time in jumps. Big jumps for hours, small jumps for minutes.',widget:{type:'timeHop',start,need}},
      {title:'Change to 24-hour clock',
       ask:makeAsk(`${t12(end)} in 24-hour clock is…`,t24(end),[t24(end-720),t24(end-60),t24(end+60)],`p.m. means after 12 noon, so add 12 to the hour: ${endH-12} + 12 = ${endH}. We write it as ${t24(end)}.`)}
    ],
    solution:[`The clock shows ${t12(start)}`,`${t12(start)} + ${dh} h = ${t12(start+dh*60)}`,`${t12(start+dh*60)} + ${dm} min = ${t12(end)}`,`${t12(end)} = ${t24(end)} in 24-hour clock`]
  };
}

// ---- 2. hours <-> minutes (paper Q13) ----
function genMinutes(){
  const n=R.pick(NAMES),A=R.pick([1,2,3]),B=R.pick([5,10,15,20,25]);
  const C=R.pick([30,35,40,45,50].filter(c=>c>B));
  const tot=A*60+B,ans=tot-C;
  const ctx=R.pick([['cleaning the house','cooking dinner'],['doing homework','reading'],['at the playground','at the library'],['practising the piano','drawing']]);
  const ds=[{label:(A*100+B-C)+' min',code:'hundred'},{label:(tot+C)+' min',code:'addLess'},{label:(A*60-C)+' min',code:'forgotB'}];
  const why={
    hundred:`1 hour is 60 minutes, not 100. So ${A} h ${B} min = ${tot} min.`,
    addLess:`"Less" means the second activity took a shorter time, so we take away ${C} min.`,
    forgotB:`Don't forget the ${B} min: ${A} h ${B} min = ${A*60} + ${B} minutes.`,
    other:`Change ${A} h ${B} min into minutes first, then take away ${C} min.`
  };
  return {skill:'minutes',
    text:`${n} spent <b>${A} h ${B} min</b> ${ctx[0]}. ${n} spent <b>${C} min less</b> ${ctx[1]}. How long did ${n} spend ${ctx[1]}? Give your answer in minutes.`,
    options:makeOptions(ans+' min',ds,()=>(ans+R.pick([-20,-10,10,20]))+' min'),answer:ans+' min',why,
    remedy:[
      {title:'Turn hours into minutes',text:'Click each hour block to open it up.',widget:{type:'hourBlocks',A,B}},
      {ask:makeAsk(`So ${A} h ${B} min = ? min`,tot+' min',[(A*100+B)+' min',(A+B)+' min',(A*60)+' min'],'1 h = 60 min. Count the opened blocks, then add the small block.'),title:'Write it in minutes'},
      {title:'Read the key word',ask:makeAsk(`"${C} min less" means…`,`Take away ${C} min`,[`Add ${C} min`],'Less means shorter. A shorter time means we take away.')},
      {title:'Work it out',ask:makeAsk(`${tot} − ${C} = ?`,ans+' min',[(ans+10)+' min',(ans-10)+' min',(tot+C)+' min'],`Try it on paper: ${tot} − ${C}.`)}
    ],
    solution:[`${A} h ${B} min = ${A} × 60 + ${B} = ${tot} min`,`${C} min less: ${tot} − ${C} = ${ans} min`]
  };
}

// ---- 3. equivalent fractions (paper Q19) ----
function frac(t,b){return `<span class="frac"><span>${t}</span><i></i><span>${b}</span></span>`}
function genFraction(){
  const bases=[[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],[1,6],[5,6]];
  let p,q,k1,k2;
  for(;;){[p,q]=R.pick(bases);const ks=[1,2,3,4,5,6].filter(k=>q*k<=12);const k2s=ks.filter(k=>k>=2);if(k2s.length<1||ks.length<2)continue;k2=R.pick(k2s);const k1s=ks.filter(k=>k!==k2);if(!k1s.length)continue;k1=R.pick(k1s);break}
  const b=q*k1,d=q*k2,c=p*k2,ans=p*k1;
  const add=c-(d-b);
  const ds=[{label:isPosInt(add)?String(add):null,code:'additive'},{label:String(c),code:'copy'}];
  const why={
    additive:`You took away the same number from the top and the bottom. Equal fractions don't work that way: we multiply or divide the top and bottom by the same number.`,
    copy:`When the bottom number changes, the top number must change too, so the fraction stays the same size.`,
    other:`Make ${c}/${d} simpler first, then find the matching fraction with ${b} at the bottom.`
  };
  return {skill:'fraction',brief:`? / ${b} = ${c} / ${d}`,
    text:'What is the missing number in the box?',
    figure:`<div class="figure"><span class="fr"><span class="frac"><span class="box"></span><i></i><span>${b}</span></span> = ${frac(c,d)}</span></div>`,
    options:makeOptions(String(ans),ds,()=>String(R.int(1,Math.max(6,b+2)))),answer:String(ans),why,
    remedy:[
      {title:'See it with fraction bars',text:`The top bar shows ${c}/${d}. Move the slider to colour parts of the bottom bar (${b} parts) until both coloured parts are the same length.`,widget:{type:'fracSlider',b,c,d,ans}},
      {title:'Make it simpler',ask:makeAsk(`Divide the top and bottom of ${c}/${d} by ${k2}. ${c}/${d} = ?`,`${p}/${q}`,[`${p}/${d}`,`${c}/${q}`,`${c-1}/${d-1}`],`${c} ÷ ${k2} = ${p} and ${d} ÷ ${k2} = ${q}.`)},
      {title:'Build the new fraction',ask:makeAsk(`${p}/${q} = ?/${b}.  ${q} × ${k1} = ${b}, so ${p} × ${k1} = ?`,String(ans),[String(ans+1),String(Math.max(1,ans-1)),isPosInt(add)?String(add):String(ans+2)],`Whatever we do to the bottom, we do to the top. Multiply ${p} by ${k1}.`)}
    ],
    solution:[`${c}/${d} = ${p}/${q} (divide top and bottom by ${k2})`,`${p}/${q} = ${ans}/${b} (multiply top and bottom by ${k1})`,`The missing number is ${ans}.`]
  };
}

function ldivHTML(N,d){
  const dg=String(N).split('').map(Number),t2=dg[0]*10+dg[1],qt=Math.floor(t2/d),r1=t2-qt*d,rest=r1*10+dg[2],qo=Math.floor(rest/d);
  const W=10,L=()=>Array(W).fill(' '),col=i=>2+2*i;
  const putNum=(l,c,n)=>{const ds=String(n).split('').reverse();ds.forEach((x,k)=>l[c-2*k]=x);l[c-2*ds.length+1]='−'};
  const under=(l,a,b)=>{for(let i=a;i<=b;i++)l[i]='─'};
  const l1=L();l1[col(1)]=String(qt);l1[col(2)]=String(qo);
  const l1b=L();under(l1b,1,col(2));
  const l2=L();l2[0]=String(d);l2[1]=')';dg.forEach((x,i)=>l2[col(i)]=String(x));
  const l3=L();putNum(l3,col(1),qt*d);
  const l4=L();under(l4,col(0)-1,col(1));
  const l5=L();l5[col(1)]=String(r1);l5[col(2)]=String(dg[2]);
  const l6=L();putNum(l6,col(2),qo*d);
  const l7=L();under(l7,col(1)-1,col(2));
  const l8=L();l8[col(2)]='0';
  return `<pre class="ldiv" aria-label="Long division of ${N} by ${d}">${[l1,l1b,l2,l3,l4,l5,l6,l7,l8].map(l=>l.join('')).join('\n')}</pre>`;
}
function genLongDiv(){
  let d,q,N,t2;
  for(let g=0;g<300;g++){d=R.pick([3,4,5,6,7,8,9]);q=R.int(11,99);N=q*d;if(N<100||N>999)continue;const s=String(N);if(+s[0]>=d)continue;t2=+s.slice(0,2);if(t2%d===0)continue;break}
  const s=String(N),qt=Math.floor(t2/d),r1=t2-qt*d,o=+s[2],rest=r1*10+o,qo=rest/d;
  const dropRem=qt*10+Math.floor(o/d),bigTen=(qt+1)*10+Math.floor(o/d);
  const why={
    divTooBig:`${d} × ${qt+1} = ${d*(qt+1)}, which is MORE than ${t2}. So ${d} goes into ${t2} only ${qt} times.`,
    divDropRem:`Don't throw away the remainder! ${t2} ÷ ${d} = ${qt} remainder ${r1}. Bring down the ${o} to make ${rest}.`,
    other:`Use long division: divide, multiply, subtract, bring down. Then check by multiplying back.`
  };
  return {skill:'longDiv',text:`What is the value of <b>${N} ÷ ${d}</b>?`,walkVisual:ldivHTML(N,d),
    options:makeOptions(String(q),[{label:String(bigTen),code:'divTooBig'},{label:String(dropRem),code:'divDropRem'}],()=>String(q+R.pick([-11,-9,-2,2,9,11,10]))),answer:String(q),why,
    remedy:[
      {title:'Start with the first 2 digits',text:`${d} cannot go into ${s[0]}, so look at ${t2}.`,ask:makeAsk(`How many ${d}s are in ${t2}?`,String(qt),[String(qt+1),String(Math.max(0,qt-1)),String(t2)],`Count up: ${d} × ${qt} = ${d*qt}. ${d} × ${qt+1} = ${d*(qt+1)}, too big!`)},
      {title:'Find what is left',ask:makeAsk(`${t2} − ${d*qt} = ?`,String(r1),[String(r1+1),'0',String(d)],`Take away: ${t2} − ${d*qt}.`)},
      {title:'Bring down the next digit',text:`Bring down the ${o} next to the ${r1}. Now we have ${rest}.`,ask:makeAsk(`${rest} ÷ ${d} = ?`,String(qo),[String(qo+1),String(Math.max(1,qo-1)),String(Math.floor(o/d))],`${d} × ${qo} = ${rest}.`)},
      {title:'Put it together',visual:ldivHTML(N,d),ask:makeAsk(`So ${N} ÷ ${d} = ?`,String(q),[String(dropRem),String(bigTen),String(qo*10+qt)],`Tens digit ${qt}, ones digit ${qo}.`)}
    ],
    solution:[`${t2} ÷ ${d} = ${qt} remainder ${r1}`,`Bring down ${o}: ${rest} ÷ ${d} = ${qo}`,`${N} ÷ ${d} = ${q}`,`Check: ${q} × ${d} = ${N} ✓`]};
}

function genFracHalf(){

  for(let v=0;v<=400;v+=50){const y=y0-v*sc;s+=v%100===0?`<line x1="${x0-6}" y1="${y}" x2="${W-10}" y2="${y}" stroke="var(--rule)"/><text x="${x0-10}" y="${y+5}" text-anchor="end" font-size="13" fill="currentColor">${v}</text>`:`<line x1="${x0-4}" y1="${y}" x2="${x0}" y2="${y}" stroke="currentColor"/><line x1="${x0}" y1="${y}" x2="${W-10}" y2="${y}" stroke="var(--rule)" stroke-dasharray="3 5"/>`}

function genBarGraph(){

// ---------- mastery ----------
function skillStats(k){
  const at=state.attempts.filter(a=>a.skill===k);const last=at.slice(-6);
  const first=last.filter(a=>a.res==='first').length;
  let stars=0;
  if(last.length>=2&&first/last.length>=0.5)stars=1;
  if(last.length>=3&&first/last.length>=0.67)stars=2;
  if(last.length>=4&&first/last.length>=0.8&&last[last.length-1].res==='first')stars=3;
  return {n:at.length,stars,first:at.filter(a=>a.res==='first').length,retry:at.filter(a=>a.res==='retry').length,fixed:at.filter(a=>a.res==='fixed').length,missed:at.filter(a=>a.res==='missed').length};
}
function needsReview(k){const cut=new Date();cut.setDate(cut.getDate()-3);const c=dstr(cut);return state.attempts.some(a=>a.skill===k&&a.res==='missed'&&a.d>=c)}
function weightedPick(keys,count){
  const pool=keys.slice(),out=[];
  while(out.length<count&&pool.length){
    const w=pool.map(k=>{const st=skillStats(k);return 1+(3-st.stars)*1.5+(needsReview(k)?4:0)+(SKILLS[k].isNew&&st.n<3?5:0)});
    let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;for(;i<pool.length;i++){r-=w[i];if(r<=0)break}
    out.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }return out;
}
const DAILY_N=6;
function planDaily(){
  const warm=Object.keys(SKILLS).filter(k=>SKILLS[k].warm),word=Object.keys(SKILLS).filter(k=>!SKILLS[k].warm);
  return [...weightedPick(warm,2),...weightedPick(word,DAILY_N-2)];
}

  }
  const optCls=o=>{
    if(Q.phase==='solved'||Q.phase==='twinDone'||Q.phase==='explore'){if(o.label===cur.answer)return 'good';if(o.label===cur.sel)return 'bad';return 'faded'}
    if(Q.phase==='remedy')return o.label===Q.lastWrong?'bad':'faded';
    if(cur.bad&&cur.bad.has(o.label))return 'bad';
    return o.label===cur.sel?'sel':'';
  };
  const gotIt=Q.phase==='solved'||(Q.phase==='twinDone'&&Q.res==='fixed');
  const showWalk=gotIt;
  const walkDone=(Q.walk||1)>=cur.solution.length;
  const canNext=(gotIt&&walkDone)||(Q.phase==='twinDone'&&Q.res==='missed');
  if(Q.phase==='explore')fb=`<div class="fb good"><p>Let's explore how it works with the hands-on guide.</p></div>`;
  app.innerHTML=`
  <div class="qbar"><button class="link" id="quit">Back to the map</button>${miniLine()}</div>
  <article class="qcard ${twin?'is-twin':''}">
    <p class="qmeta"><span>${twin?'Twin question':`Question ${quest.i+1} of ${quest.qs.length}`}</span><span class="tag">${SKILLS[cur.skill].short}</span></p>
    <div class="qtext">${cur.text}</div>
    ${cur.figure||''}
    <p class="paper">✏️ Work it out on your paper, then choose your answer.</p>
    <div class="opts" role="group" aria-label="Answer choices">${cur.options.map(o=>`<button class="opt ${optCls(o)}" data-l="${esc(o.label)}" ${locked||(cur.bad&&cur.bad.has(o.label))?'disabled':''} aria-pressed="${o.label===cur.sel}">${o.label}</button>`).join('')}</div>
    <div class="actions">
      ${!locked?`<button class="btn" id="check" ${cur.sel?'':'disabled'}>Check my answer</button>`:''}
      ${!locked&&!cur.showHint?`<button class="btn soft" id="hintBtn">💡 Hint</button>`:''}

    </div>
    ${!locked&&cur.showHint?`<p class="tip hintbox">💡 ${TIPS[cur.skill]}${Q.learn?' <button class="link" id="relearn">See the example again</button>':''}</p>`:''}
    <div aria-live="polite">${fb}${showWalk?walkHTML(Q,cur):''}</div>
    ${canNext?`<div class="actions"><button class="btn" id="next">${last?'Finish the ride':'Next question'}</button></div>`:''}
  </article>
  ${Q.phase==='remedy'||Q.phase==='explore'?'<section class="guide" id="guide"></section>':''}`;
  document.getElementById('quit').onclick=()=>askConfirm('Leave this ride?','Questions you already finished are saved. You can start a new ride any time.','Leave the ride','Keep going',()=>{view='home';render()});
  app.querySelectorAll('.opt:not([disabled])').forEach(b=>b.onclick=()=>{cur.sel=b.dataset.l;renderQuest()});
  const ch=document.getElementById('check');if(ch)ch.onclick=()=>check(Q,cur);
  const hb=document.getElementById('hintBtn');if(hb)hb.onclick=()=>{cur.showHint=true;Q.hinted=true;renderQuest()};
  const rl=document.getElementById('relearn');if(rl)rl.onclick=()=>{Q.learned=false;renderQuest();window.scrollTo(0,0)};
  const nx=document.getElementById('next');if(nx)nx.onclick=nextQ;
  const more=document.getElementById('more');if(more)more.onclick=()=>{Q.walk=(Q.walk||1)+1;renderQuest();const m=document.getElementById('more')||document.getElementById('next');if(m)m.focus({preventScroll:true})};
  const exp=document.getElementById('explore');if(exp)exp.onclick=()=>{Q.phase='explore';Q.step=0;Q.explored=true;renderQuest();const g=document.getElementById('guide');if(g)g.scrollIntoView({behavior:'smooth',block:'start'})};
  if(Q.phase==='remedy'||Q.phase==='explore')renderGuide(Q);
}

function walkHTML(Q,cur){
  const L=cur.solution,n=Math.min(Q.walk||1,L.length),all=n>=L.length;
  return `<section class="walk"><h3>How to solve it</h3><p class="tip">💡 ${TIPS[cur.skill]}</p>${cur.walkVisual?`<div class="figure">${cur.walkVisual}</div>`:''}
  <ol class="sol">${L.slice(0,n).map((l,i)=>`<li class="${i===n-1&&n>1?'fresh':''}">${l}</li>`).join('')}</ol>
  <p class="muted" style="font-size:16px">${all?'Did your working match? If not, fix it on your paper.':'Compare each step with your working on paper.'}</p>
  <div class="actions">${all?'':`<button class="btn soft" id="more">Show next step (${n} of ${L.length})</button>`}${all&&Q.phase==='solved'&&!Q.explored&&Q.res!=='fixed'?`<button class="btn soft" id="explore">Try the hands-on guide</button>`:''}</div></section>`;
}
function check(Q,cur){
  const opt=cur.options.find(o=>o.label===cur.sel);if(!opt)return;
  const ok=opt.label===cur.answer;
  if(Q.phase==='ask'||Q.phase==='retry')Q.picks.push(opt.label);
  if(Q.phase==='ask'){
    if(ok){Q.res='first';Q.phase='solved';record(Q,'first')}
    else{Q.firstCode=opt.code;cur.bad.add(opt.label);cur.sel=null;Q.phase='retry'}
  }else if(Q.phase==='retry'){
    if(ok){Q.res='retry';Q.phase='solved';record(Q,'retry')}
    else{Q.lastWrong=opt.label;Q.secondCode=opt.code;cur.bad.add(opt.label);Q.phase='remedy';Q.step=0}
  }else if(Q.phase==='twin'){
    Q.res=ok?'fixed':'missed';Q.phase='twinDone';record(Q,Q.res);
  }
  renderQuest();
  if(Q.phase==='remedy'){const g=document.getElementById('guide');if(g)g.scrollIntoView({behavior:'smooth',block:'start'})}
}
function nextQ(){if(quest.i<quest.qs.length-1){quest.i++;quest.qs[quest.i].t0=Date.now();render()}else finish()}

function renderGuide(Q){
  const g=document.getElementById('guide');const steps=Q.remedy;const st=steps[Q.step];const last=Q.step===steps.length-1;
  g.innerHTML=`<div class="guide-head"><h2>Step ${Q.step+1} of ${steps.length}</h2><div class="dots">${steps.map((s,i)=>`<span class="${i<Q.step?'ok':i===Q.step?'on':''}"></span>`).join('')}</div></div>
  <div class="step"><h3>${st.title||''}</h3>${st.text?`<p>${st.text}</p>`:''}${st.visual||''}
   ${st.widget?'<div class="w" id="wid"></div>':''}
   ${st.ask?`<div class="ask"><div class="q">${st.ask.q}</div><div class="chips">${st.ask.options.map(o=>`<button class="chip" data-v="${esc(o)}">${o}</button>`).join('')}</div><div class="hint" id="hint"></div></div>`:''}
  </div>
  <div class="nextrow hidden" id="stepNext"><button class="btn ${last?'alt':''}" id="stepBtn">${last?(Q.phase==='explore'?'Done':'Try a twin question'):'Next step'}</button></div>`;
  const reveal=()=>{document.getElementById('stepNext').classList.remove('hidden');document.getElementById('stepBtn').focus({preventScroll:true})};
  if(st.widget)WIDGETS[st.widget.type](document.getElementById('wid'),st.widget,reveal);
  if(st.ask){
    g.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
      if(c.dataset.v===st.ask.correct){c.classList.add('good');g.querySelectorAll('.chip').forEach(x=>x.disabled=true);document.getElementById('hint').innerHTML='✅ Yes!';reveal()}
      else{c.classList.add('bad');c.disabled=true;document.getElementById('hint').innerHTML='💡 '+st.ask.hint}
    });
  }
  document.getElementById('stepBtn').onclick=()=>{
    if(last&&Q.phase==='explore'){Q.phase='solved';Q.walk=Q.solution.length;renderQuest();const n=document.getElementById('next');if(n){n.scrollIntoView({behavior:'smooth',block:'center'});n.focus({preventScroll:true})}}
    else if(last){Q.twin=newQ(Q.skill,Q.answer);Q.phase='twin';renderQuest();window.scrollTo(0,0)}
    else{Q.step++;renderGuide(Q);g.scrollIntoView({behavior:'smooth',block:'start'})}
  };
}

WIDGETS.shadeGrid=function(el,{rows,cols,set,target},done){
  const orig=new Set(set),on=new Set(set);let fin=false;const C=46;
  const draw=()=>{
    let svg=`<svg viewBox="0 0 ${cols*C+4} ${rows*C+4}" width="${cols*C+4}" role="group" aria-label="Click parts to shade">`;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const i=r*cols+c;svg+=`<rect data-i="${i}" class="${orig.has(i)?'':'cell'}" x="${2+c*C}" y="${2+r*C}" width="${C}" height="${C}" fill="${orig.has(i)?'var(--ink)':on.has(i)?'var(--sun)':'var(--paper)'}" stroke="currentColor" stroke-width="2"/>`}
    const added=on.size-orig.size;
    el.innerHTML=svg+`</svg><p class="readout">Shaded: <b>${on.size}</b> of ${rows*cols}. Goal: <b>${target}</b>.</p><p class="msg ${on.size===target?'ok':on.size>target?'no':''}">${on.size===target?`Done! You shaded ${added} more part${added===1?'':'s'}. 🎉`:on.size>target?'Too many! Click a yellow part to un-shade it.':''}</p>`;
    if(!fin)el.querySelectorAll('rect.cell').forEach(r=>r.onclick=()=>{const i=+r.dataset.i;on.has(i)?on.delete(i):on.add(i);if(on.size===target){fin=true;draw();done()}else draw()});
  };draw();
};
function finish(){
  const first=quest.results.filter(r=>r.res==='first').length;
  if(quest.mode==='redo'){const r=dayRuns(quest.day);quest.prev=r.length?r[r.length-1].first:null}
  state.sessions.push({d:today(),mode:quest.mode,day:quest.day,n:quest.results.length,first,secs:Math.round((Date.now()-quest.t0)/1000),qs:quest.results});save();
  view='done';render();
}
function renderDone(){
  const rs=quest.results,first=rs.filter(r=>r.res==='first').length,fixed=rs.filter(r=>r.res==='fixed'||r.res==='retry').length,missed=rs.filter(r=>r.res==='missed').length;
  const icon={first:'⭐',retry:'👍',fixed:'🏅',missed:'🔁'},word={first:'Right first time',retry:'Fixed it with a clue',fixed:'Fixed it with the guide',missed:'Will come back for more practice'};
  const isDay=quest.mode==='daily',d=quest.day,hasNext=isDay&&d<TOTAL_DAYS;
  app.innerHTML=`<section class="done"><h1 class="display">${isDay?`Day ${d} complete! 🚆`:quest.mode==='redo'?`Day ${d} redo complete!`:'Ride complete! 🚆'}</h1>
  <p class="big">${first} / ${rs.length}</p><p class="muted">right first time</p>
  ${quest.mode==='redo'&&quest.prev!=null?`<p class="display" style="font-size:22px">${first>quest.prev?`Last time ${quest.prev}/${rs.length}, now ${first}/${rs.length}. You improved! 📈`:first===quest.prev?`Same as last time (${first}/${rs.length}). Steady!`:`Last time ${quest.prev}/${rs.length}. Look at the guides again and try once more.`}</p>`:''}
  ${fixed?`<p>You fixed ${fixed} question${fixed>1?'s':''} after a mistake. Fixing mistakes is how you get better.</p>`:''}
  ${missed?`<p>${missed} question type${missed>1?'s':''} will come back in later rides for more practice.</p>`:''}
  <ul class="rlist">${rs.map(r=>`<li><span style="font-size:24px">${icon[r.res]}</span><span><b>${SKILLS[r.skill].name}</b><br><span class="muted">${word[r.res]}</span></span></li>`).join('')}</ul>
  <div class="actions">${isDay?`<button class="btn" id="play">🎁 Play your reward: ${GAMES[gameFor(d).id].name}</button>`:''}${hasNext?`<button class="btn soft" id="nextDay">Start Day ${d+1}</button>`:''}<button class="btn soft" id="home">Back to the map</button></div></section>`;
  document.getElementById('home').onclick=()=>{view='home';render()};
  const nx=document.getElementById('nextDay');if(nx)nx.onclick=()=>startDay(d+1);
  const pl=document.getElementById('play');if(pl)pl.onclick=()=>{gameDay=d;view='game';render()};
}

function daysSince(ds){if(!ds)return Infinity;const [y,m,d]=ds.split('-').map(Number);const t=new Date();t.setHours(0,0,0,0);return Math.round((t-new Date(y,m-1,d))/86400000)}
function needBackup(){return state.sessions.length>0&&daysSince(state.lastBackup)>=3}
function backupStatus(){
  if(!state.sessions.length)return 'No progress yet. Download a backup after her first few rides.';
  const n=daysSince(state.lastBackup);
  if(n===Infinity)return '⚠️ Not backed up yet. Download a backup and keep the file somewhere safe (e.g. Google Drive).';
  const when=n===0?'today':n===1?'yesterday':n+' days ago';
  return (n>=3?'⚠️ ':'✅ ')+`Last backup: ${when}${n>=3?'. Time to download a fresh one.':'.'}`;
}
async function showPersist(){
  const el=document.getElementById('persist');if(!el||!navigator.storage||!navigator.storage.persisted)return;
  try{const p=await navigator.storage.persisted();el.textContent=p?'This browser has agreed to keep her progress, so it won\u2019t be cleared to free up space.':'This browser may clear saved data if space runs low, so regular backups matter.'}catch(e){}
}
function backupPayload(){return JSON.stringify({app:'yuen-maths-line',exportedAt:new Date().toISOString(),state},null,1)}
async function downloadBackup(){
  const msg=document.getElementById('bkMsg'),name=`yuen-maths-backup-${today()}.json`;
  state.lastBackup=today();const data=backupPayload();
  let done=false;
  try{
    if(window.claude&&window.claude.use){const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data});done=true}}
  }catch(e){if(e&&e.code==='declined'){state.lastBackup=undefined;msg.className='msg no';msg.textContent='Backup cancelled.';return}}
  if(!done){const u=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
  save();
  document.getElementById('bkStatus').textContent=backupStatus();document.querySelector('.backup').classList.remove('warn');
  msg.className='msg ok';msg.textContent=`Saved ${name}. Keep it somewhere safe.`;
}
function summary(st){const days=new Set((st.sessions||[]).filter(x=>x.mode==='daily').map(x=>x.d)).size;return `${days} day${days===1?'':'s'} done, ${(st.attempts||[]).length} questions`}
function restoreBackup(file){
  const msg=document.getElementById('bkMsg');const r=new FileReader();
  r.onload=()=>{
    let st=null;try{const j=JSON.parse(r.result);st=j&&j.app==='yuen-maths-line'?j.state:null}catch(e){}

function matchPairs(level){
  const n=level<=2?6:8,out=[],used=new Set();
  const makers=[
    ()=>{const [p,q]=R.pick([[1,2],[1,3],[2,3],[1,4],[3,4],[2,5],[1,5],[5,6]]);const k=R.int(2,3);return [`${p}/${q}`,`${p*k}/${q*k}`]},
    ()=>{const h=R.int(1,2),m=R.pick([5,10,15,20,30,45]);return [`${h} h ${m} min`,`${h*60+m} min`]},
    ()=>{const t=R.int(13,20)*60+R.pick([0,15,30,45]);return [t12(t),t24(t)]},
    ()=>{const c=R.int(11,49)*5;return [money(c),`${c}¢`]},
    ()=>{const a=R.int(3,9),b=R.int(3,9);return [`${a} × ${b}`,`${a*b}`]},
    ()=>{const a=R.int(2,9)*100+R.int(1,9)*10;const tn=(a%100)/10;return [`${Math.floor(a/100)} hundreds ${tn} ten${tn>1?'s':''}`,`${a}`]}
  ];
  let g=0,order=R.shuffle(makers);while(out.length<n&&g++<200){const pr=order[g%order.length]();if(used.has(pr[0])||used.has(pr[1]))continue;used.add(pr[0]);used.add(pr[1]);out.push(pr)}
  return out;
}

  const els=[...st.querySelectorAll('.mcard')];

  function loop(now){const dt=Math.min(50,now-last)/1000;last=now;const left=Math.max(0,DUR-(now-t0)/1000);
    spawn-=dt;if(spawn<=0&&bl.filter(b=>!b.gone).length<10){spawn=2.2-level*0.2;const a=part();add(a,0);add(T-a,8+Math.random()*10);if(Math.random()<0.4)add(part(),16)}
    for(const b of bl){if(b.gone)continue;b.y-=b.sp*dt;b.el.style.top=b.y+'%';if(b.y<-22){b.gone=true;b.el.remove();if(sel===b)sel=null}}
    bl=bl.filter(b=>!b.gone||b.el.isConnected);
    hud(hudEl,[`Target <b>${T}</b>`,`Score <b>${score}</b>`,`Time <b>${Math.ceil(left)}s</b>`]);
    if(left<=0){over=true;end(score)}else raf=requestAnimationFrame(loop)}
  raf=requestAnimationFrame(loop);return ()=>{over=true;cancelAnimationFrame(raf)};
}

// ---- Durian Dash ----
function durian(x,cx,cy,r){x.fillStyle='#7BA23F';x.beginPath();for(let i=0;i<24;i++){const a=i*Math.PI/12,rr=i%2?r:r*1.22;x.lineTo(cx+rr*Math.cos(a),cy+rr*0.9*Math.sin(a))}x.closePath();x.fill();x.strokeStyle='#4E6B22';x.lineWidth=2;x.stroke();x.fillStyle='#5C4326';x.fillRect(cx-3,cy-r*1.2,6,8)}
function gameDash(st,level,hudEl,end){
  const [c,x]=makeCanvas(st),DUR=60,G=2000,GY=350;
  let py=GY,vy=0,obs=[],coins=[],score=0,hp=3,inv=0,t0=performance.now(),last=t0,next=1.2,cnext=0.8,raf,scroll=0;
  const jump=e=>{if(e&&e.type==='keydown'){if(e.code!=='Space'&&e.key!=='ArrowUp')return;e.preventDefault()}if(py>=GY-1)vy=-760};
  addEventListener('keydown',jump);c.addEventListener('pointerdown',jump);
  const stop=()=>{cancelAnimationFrame(raf);removeEventListener('keydown',jump)};
  const blocks=[...Array(9)].map((_,i)=>({x:i*110,h:120+((i*37)%90),c:['#F2C4B5','#B8D8E8','#F5E1A4','#CFE3C4'][i%4]}));
  function loop(now){const dt=Math.min(50,now-last)/1000;last=now;const el=(now-t0)/1000,left=Math.max(0,DUR-el),sp=280+level*40+el*3;
    vy+=G*dt;py=Math.min(GY,py+vy*dt);if(py>=GY)vy=0;inv=Math.max(0,inv-dt);scroll+=sp*dt;
    next-=dt;if(next<=0){obs.push({x:800,passed:false});next=Math.max(0.75,1.5-level*0.12)+Math.random()*0.9}
    cnext-=dt;if(cnext<=0){const h=GY-60-Math.random()*120;for(let k=0;k<3;k++)coins.push({x:820+k*34,y:h});cnext=1.6+Math.random()*1.4}
    for(const o of obs){o.x-=sp*dt;if(!o.hit&&Math.abs(o.x-120)<34&&py>GY-40&&inv<=0){o.hit=true;hp--;inv=1.2}if(!o.passed&&o.x<90){o.passed=true;if(!o.hit)score+=1}}
    for(const k of coins){k.x-=sp*dt;if(!k.got&&Math.abs(k.x-120)<26&&Math.abs(k.y-(py-24))<34){k.got=true;score+=2}}
    obs=obs.filter(o=>o.x>-40);coins=coins.filter(k=>k.x>-20&&!k.got);
    x.fillStyle='#BFE3F7';x.fillRect(0,0,760,420);
    for(const b of blocks){const bx=((b.x-scroll*0.3)%990+990)%990-110;x.fillStyle=b.c;x.fillRect(bx,GY+14-b.h,90,b.h);x.fillStyle='rgba(255,255,255,.7)';for(let r=0;r<b.h-20;r+=22)for(let q=0;q<3;q++)x.fillRect(bx+10+q*27,GY+22-b.h+r,14,10)}
    x.fillStyle='#8C8C8C';x.fillRect(0,GY+14,760,56);x.fillStyle='#fff';for(let i=0;i<10;i++)x.fillRect(((i*100-scroll)%1000+1000)%1000-40,GY+40,50,5);
    for(const k of coins){x.fillStyle='#FFC21A';x.beginPath();x.arc(k.x,k.y,11,0,7);x.fill();x.fillStyle='#A6700A';x.font='bold 13px sans-serif';x.textAlign='center';x.fillText('$',k.x,k.y+5)}
    for(const o of obs)durian(x,o.x,GY-2,20);
    if(!(inv>0&&Math.floor(inv*10)%2)){x.font='44px serif';x.textAlign='center';x.fillText('🐱',120,py+4)}
    hud(hudEl,[`Score <b>${score}</b>`,hearts(hp),`Time <b>${Math.ceil(left)}s</b>`]);
    if(hp<=0||left<=0){stop();end(score)}else raf=requestAnimationFrame(loop)}
  raf=requestAnimationFrame(loop);return stop;
}
const GAME_FNS={catch:gameCatch,match:gameMatch,pop:gameBalloon,dash:gameDash};

render();
